{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Reset Password</h2>

        <p class="sub-text">
            Enter your email to reset password
        </p>

        <form method="POST">

            <input type="email" name="email" placeholder="Enter your email" required>

            <button type="submit">Send Reset Link</button>

        </form>

    </div>

</div>

{% endblock %}
